name: Browser Mac Catalyst validation

on:
  push:
    branches: [codex/validate-browser-window]

jobs:
  baseline:
    if: github.sha == '5e61d2fcf495679b5713952b0b701a2fe59f7d03'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: c64c9647704779ffa641e8870adabbd8fdf0476f
      - name: Configure unsigned build
        run: |
          cp User.template.xcconfig Config/User.xcconfig
          xcodebuild -version
      - name: Build unchanged upstream on Mac Catalyst
        run: |
          set -o pipefail
          xcodebuild build -quiet -scheme Moblin \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            -resultBundlePath BrowserLayout.xcresult \
            CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM= \
            BASE_PRODUCT_BUNDLE_IDENTIFIER=org.jkondo.MoblinBrowserValidation \
            2>&1 | tee catalyst.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: upstream-catalyst-results
          path: |
            catalyst.log
            BrowserLayout.xcresult
  focused:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Prepare focused source validation
        run: |
          brew install xcodegen
          python3 .validation/prepare.py
          cd BrowserValidation
          xcodegen generate
      - name: Compile small browser view and run unchanged test suite on Mac Catalyst
        working-directory: BrowserValidation
        run: |
          set -o pipefail
          xcodebuild test -quiet -scheme BrowserValidation \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            -resultBundlePath FocusedBrowser.xcresult \
            CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM= \
            2>&1 | tee focused.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: focused-catalyst-results
          path: |
            BrowserValidation/focused.log
            BrowserValidation/FocusedBrowser.xcresult
